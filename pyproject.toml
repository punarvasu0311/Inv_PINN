[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inv-pinn"
version = "0.1.0"
description = "Uncertainty-Aware Physics-Constrained Generative Inverse Design of Perovskite Solar Cells"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Chavali Adithya Krishna Saketh" },
    { name = "Baddipadige Sameer Reddy" },
    { name = "Harshith Kuragayala" },
]
dependencies = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "shap>=0.43.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
